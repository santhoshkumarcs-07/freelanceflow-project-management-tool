services:
  - type: web
    name: freelanceflow
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PRO_MONTHLY_PRICE_INR
        value: "499"
      - key: RAZORPAY_TEST_KEY_ID
        sync: false
      - key: RAZORPAY_TEST_KEY_SECRET
        sync: false
      - key: RAZORPAY_TEST_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PRO_PLAN_ID_TEST
        sync: false
      - key: RAZORPAY_LIVE_KEY_ID
        sync: false
      - key: RAZORPAY_LIVE_KEY_SECRET
        sync: false
      - key: RAZORPAY_LIVE_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PRO_PLAN_ID_LIVE
        sync: false
